services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: likemylinks
      POSTGRES_PASSWORD: likemylinks
      POSTGRES_DB: likemylinks
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - likemylinks_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U likemylinks"]
      interval: 5s
      retries: 10
volumes:
  likemylinks_data:
