services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pinicon
      POSTGRES_PASSWORD: pinicon
      POSTGRES_DB: pinicon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pinicon_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinicon"]
      interval: 5s
      retries: 10
volumes:
  pinicon_data:
